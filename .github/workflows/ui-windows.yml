name: Windows UI test

# The 25-scenario UI test on Windows without the installer build and acceptance
# test, for quick iteration. The full pipeline (windows-installer.yml) runs the
# same test as part of every build.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "scripts/ui-e2e.mjs"
      - ".github/workflows/ui-windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pefile
          npm ci

      - name: Cache third-party downloads
        uses: actions/cache@v4
        with:
          path: runtime/cache
          key: runtime-cache-${{ hashFiles('scripts/build_runtime_win.py', 'engine/requirements-win.txt') }}

      - name: Assemble offline runtime and build the app
        run: |
          python scripts/build_runtime_win.py
          npm run build

      - name: Generate synthetic test documents
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --target "$env:RUNNER_TEMP\testdeps" pytest reportlab
          $rt = (Resolve-Path "runtime\win").Path
          $env:NAYANPDF_TESSERACT = "$rt\tesseract\tesseract.exe"
          $env:NAYANPDF_TESSDATA  = "$rt\tesseract\tessdata"
          $env:NAYANPDF_SOFFICE   = "$rt\libreoffice\program\soffice.exe"
          $env:NAYANPDF_GS        = "$rt\ghostscript\bin\gswin64c.exe"
          $env:NAYANPDF_GS_ICC    = "$rt\ghostscript\iccprofiles\srgb.icc"
          $env:PYTHONPATH = "$env:RUNNER_TEMP\testdeps"
          & "$rt\python\python.exe" -X utf8 -m pytest engine\tests -q -p no:cacheprovider -k test_probe
          if ($LASTEXITCODE -ne 0) { throw "fixture generation failed" }

      - name: UI end-to-end test
        shell: pwsh
        env:
          DEBUG: "pw:browser*"
          ELECTRON_ENABLE_LOGGING: "1"
        run: |
          Get-Item node_modules\electron\dist\electron.exe | Format-List FullName, Length
          $rt = (Resolve-Path "runtime\win").Path
          $env:NAYANPDF_PYTHON    = "$rt\python\python.exe"
          $env:NAYANPDF_TESSERACT = "$rt\tesseract\tesseract.exe"
          $env:NAYANPDF_TESSDATA  = "$rt\tesseract\tessdata"
          $env:NAYANPDF_SOFFICE   = "$rt\libreoffice\program\soffice.exe"
          $env:NAYANPDF_GS        = "$rt\ghostscript\bin\gswin64c.exe"
          $env:NAYANPDF_GS_ICC    = "$rt\ghostscript\iccprofiles\srgb.icc"
          node scripts/ui-e2e.mjs
          if ($LASTEXITCODE -ne 0) { throw "UI end-to-end test failed" }

      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-windows
          path: |
            test-results/ui/*.png
            test-results/ui/results.json
          if-no-files-found: warn
