name: Windows installer

on:
  push:
    branches: ["claude/**", "main"]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "scripts/ui-e2e.mjs"
      - ".github/workflows/ui-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build tools
        run: python -m pip install --disable-pip-version-check pefile

      - name: Install Node dependencies
        run: npm ci

      - name: Cache third-party downloads
        uses: actions/cache@v4
        with:
          path: runtime/cache
          key: runtime-cache-${{ hashFiles('scripts/build_runtime_win.py', 'engine/requirements-win.txt') }}
          # A changed build script still starts from the previous downloads.
          restore-keys: runtime-cache-

      - name: Assemble offline runtime (Python, Tesseract, Ghostscript, LibreOffice)
        run: python scripts/build_runtime_win.py

      - name: Type check and build the application
        run: |
          npm run typecheck
          npm run build

      - name: Engine tests on Windows with the bundled runtime (before packaging)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --target "$env:RUNNER_TEMP\testdeps" pytest reportlab
          $rt = "runtime\win"
          $env:NAYANPDF_TESSERACT = (Resolve-Path "$rt\tesseract\tesseract.exe").Path
          $env:NAYANPDF_TESSDATA  = (Resolve-Path "$rt\tesseract\tessdata").Path
          $env:NAYANPDF_SOFFICE   = (Resolve-Path "$rt\libreoffice\program\soffice.exe").Path
          $env:NAYANPDF_GS        = (Resolve-Path "$rt\ghostscript\bin\gswin64c.exe").Path
          $env:NAYANPDF_GS_ICC    = (Resolve-Path "$rt\ghostscript\iccprofiles\srgb.icc").Path
          $env:PYTHONPATH = "$env:RUNNER_TEMP\testdeps"
          New-Item -ItemType Directory -Force -Path acceptance | Out-Null
          & "$rt\python\python.exe" -X utf8 -m pytest engine\tests -q -p no:cacheprovider --junitxml acceptance\engine-tests-runtime.xml 2>&1 | Tee-Object acceptance\engine-tests-runtime.txt
          if ($LASTEXITCODE -ne 0) { throw "engine tests failed" }

      - name: Desktop resolution for UI tests (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution | Format-Table

      - name: UI end-to-end test on Windows (development build, bundled runtime)
        shell: pwsh
        continue-on-error: true
        run: |
          $rt = Resolve-Path "runtime\win"
          $env:NAYANPDF_PYTHON    = "$rt\python\python.exe"
          $env:NAYANPDF_TESSERACT = "$rt\tesseract\tesseract.exe"
          $env:NAYANPDF_TESSDATA  = "$rt\tesseract\tessdata"
          $env:NAYANPDF_SOFFICE   = "$rt\libreoffice\program\soffice.exe"
          $env:NAYANPDF_GS        = "$rt\ghostscript\bin\gswin64c.exe"
          $env:NAYANPDF_GS_ICC    = "$rt\ghostscript\iccprofiles\srgb.icc"
          # Read Out Loud can only be heard where a sound device exists; record how many.
          $env:NAYANPDF_TEST_AUDIO_DEVICES = "$(@(Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue).Count)"
          Write-Host "Sound devices: $env:NAYANPDF_TEST_AUDIO_DEVICES; Windows Audio service: $((Get-Service Audiosrv -ErrorAction SilentlyContinue).Status)"
          node scripts/ui-e2e.mjs 2>&1 | Tee-Object acceptance\ui-e2e.txt
          $code = $LASTEXITCODE
          Remove-Item -Recurse -Force test-results\ui\work -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force test-results\ui acceptance\ui-e2e
          if ($code -ne 0) { throw "UI end-to-end test failed" }

      - name: Build X-PDF_Setup.exe
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Installer facts
        shell: pwsh
        run: |
          $f = Get-Item release\X-PDF_Setup.exe
          $h = (Get-FileHash $f -Algorithm SHA256).Hash
          "X-PDF_Setup.exe  $([math]::Round($f.Length/1MB,1)) MB  SHA-256 $h" | Tee-Object acceptance\installer.txt
          $h | Out-File -Encoding ascii release\X-PDF_Setup.exe.sha256

      - name: Previous release for the upgrade test (NayanPDF, the name before 1.1)
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path previous | Out-Null
          gh release download v1.0.0-build.13 --pattern NayanPDF_Setup.exe --dir previous --repo ${{ github.repository }}

      - name: Acceptance test (upgrade, install, offline operation, UI, uninstall, reinstall)
        shell: pwsh
        run: |
          $prev = if (Test-Path previous\NayanPDF_Setup.exe) { (Resolve-Path previous\NayanPDF_Setup.exe).Path } else { "" }
          ./scripts/win-acceptance.ps1 -Installer release\X-PDF_Setup.exe -PreviousInstaller $prev -ReportDir acceptance -TestDeps "$env:RUNNER_TEMP\testdeps"

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X-PDF_Setup
          path: |
            release/X-PDF_Setup.exe
            release/X-PDF_Setup.exe.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: |
            acceptance/**
            runtime/win/MANIFEST.json
          if-no-files-found: warn

      - name: Publish pre-release with the installer
        if: success() && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version-build.${{ github.run_number }}"
          $notes = "Automated build of ${{ github.sha }}.`n`nAll acceptance checks passed on windows-latest (see the acceptance-report artifact of run ${{ github.run_id }}).`n`n" + (Get-Content acceptance\installer.txt -Raw)
          gh release create $tag release\X-PDF_Setup.exe release\X-PDF_Setup.exe.sha256 acceptance\report.md --target ${{ github.sha }} --prerelease --title "X PDF $tag" --notes $notes
