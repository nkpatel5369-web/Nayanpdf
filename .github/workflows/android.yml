name: Android

# Builds N PDF for Android, checks that it requests no network permission, tests
# the PDF engine and the app (release build) on Android 14 and Android 11
# emulators, and publishes the APK as a pre-release when everything passes.
on:
  push:
    branches: ["claude/**", "main"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key for this build only (test builds)
        run: |
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore "$RUNNER_TEMP/npdf-test.p12" -storetype PKCS12 -storepass "$pw" -keypass "$pw" \
            -alias npdf -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=N PDF test build" > /dev/null 2>&1
          echo "NPDF_KEYSTORE=$RUNNER_TEMP/npdf-test.p12" >> "$GITHUB_ENV"
          echo "NPDF_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Unit tests (scanner engine and Office export, on the JVM)
        working-directory: android
        run: ./gradlew --no-daemon :scankit:test

      - name: Build the APK and the test APKs
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleReleaseAndroidTest :engine:assembleDebugAndroidTest

      - name: Permission audit (no network access)
        working-directory: android
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt2" dump permissions "$apk" | tee ../permissions.txt
          if grep -E "INTERNET|NETWORK|WIFI|BLUETOOTH|NEARBY|LOCATION|READ_EXTERNAL|WRITE_EXTERNAL|MANAGE_EXTERNAL|CONTACTS|SMS|PHONE|AUDIO|MEDIA" ../permissions.txt; then
            echo "::error::The APK requests a permission N PDF must not have"; exit 1
          fi
          # Exactly these permissions: the scanner's camera and AndroidX's app-internal receiver permission.
          others=$(grep -oE "name='[^']+'" ../permissions.txt | sort -u | grep -vE "android.permission.CAMERA|DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$others" ]; then echo "::error::Unexpected permissions: $others"; exit 1; fi
          ls -l "$apk"

      - name: Guard against two MuPDF 1.28.2 Java binding calls that corrupt documents
        working-directory: android
        run: |
          # PDFObject.push(PDFObject) and PDFDocument.addObject over-release references; use Pdf.append / Pdf.indirect.
          if grep -rnE "\.addObject\(|(^|[^A-Za-z_.])push\(|\.push\(" --include=*.kt engine/src/main app/src/main | grep -v "^\S*:[0-9]*:\s*//"; then
            echo "::error::Use Pdf.append / Pdf.indirect instead of push / addObject"; exit 1
          fi

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Engine and app tests on an Android 14 emulator
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          working-directory: android
          script: |
            adb logcat -G 16M || true
            adb logcat -c || true
            ./gradlew --no-daemon :engine:connectedDebugAndroidTest || touch failed
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest || touch failed
            mkdir -p results/api34/screens && timeout 60 adb pull /sdcard/Download/npdf-screens/. results/api34/screens/ || true
            timeout 60 adb logcat -d > logcat-api34.txt || true
            timeout 60 adb logcat -d -s NPDF-PERF:I NPDF-COMPRESS:I NPDF-NET:I NPDF-OCR:I NPDF-EXPORT:I NPDF-SCANEDIT:I NPDF-SCAN:I > npdf-log-api34.txt || true
            mkdir -p results/api34/engine results/api34/app
            cp -r engine/build/outputs/androidTest-results/. results/api34/engine/ || true
            cp -r app/build/outputs/androidTest-results/. results/api34/app/ || true
            test ! -f failed

      # The first Android 11 emulator was lost mid-run in runs 17, 20 and 22, each time about 150
      # seconds after the Android 14 emulator shut down, while a second Android 11 emulator (run 22)
      # ran to the end. The emulator's netsim daemon is shared between emulators and outlives the
      # one that started it, so whatever the previous emulator left running is stopped first.
      - name: Stop what the previous emulator left running
        if: ${{ !cancelled() }}
        run: |
          ps -eo pid,etime,cmd | grep -E "netsimd|qemu-system|emulator/emulator" | grep -v grep || echo "nothing left"
          pkill -f netsimd || true
          pkill -f qemu-system || true
          for i in $(seq 1 30); do pgrep -f "netsimd|qemu-system" > /dev/null || break; sleep 1; done
          pgrep -fa "netsimd|qemu-system" || echo "all stopped"
          adb kill-server || true

      # A lost emulator is not a test result, so that one case, and only that case, gets one re-run
      # on a fresh emulator. Any failed test fails the job, re-run or not.
      - name: App tests on an Android 11 emulator
        id: api30
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          working-directory: android
          script: |
            adb logcat -G 16M || true
            adb logcat -c || true
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest > api30-run1.log 2>&1 && touch ok30 || touch failed30
            cat api30-run1.log
            mkdir -p results/api30/screens && timeout 60 adb pull /sdcard/Download/npdf-screens/. results/api30/screens/ || true
            timeout 60 adb logcat -d > logcat-api30.txt || true
            timeout 60 adb logcat -d -s NPDF-PERF:I NPDF-NET:I NPDF-OCR:I NPDF-SCAN:I > npdf-log-api30.txt || true
            mkdir -p results/api30/app
            cp -r app/build/outputs/androidTest-results/. results/api30/app/ || true
            if [ -f failed30 ] && grep -qE "Test run failed to complete|device offline" api30-run1.log && ! grep -rqE 'failures="[1-9]|errors="[1-9]' results/api30/app; then touch lost30; echo "::warning::The Android 11 emulator stopped responding with no failed test; re-running on a fresh emulator"; fi
            test -f ok30

      - name: Stop what the lost emulator left running
        if: ${{ !cancelled() && hashFiles('android/lost30') != '' }}
        run: |
          pkill -f netsimd || true
          pkill -f qemu-system || true
          for i in $(seq 1 30); do pgrep -f "netsimd|qemu-system" > /dev/null || break; sleep 1; done
          adb kill-server || true

      - name: App tests on a fresh Android 11 emulator (only after the first one was lost)
        if: ${{ !cancelled() && hashFiles('android/lost30') != '' }}
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          working-directory: android
          script: |
            adb logcat -G 16M || true
            adb logcat -c || true
            rm -rf results/api30 app/build/outputs/androidTest-results
            ./gradlew --no-daemon :app:connectedReleaseAndroidTest && touch ok30b || touch failed30b
            mkdir -p results/api30/screens && timeout 60 adb pull /sdcard/Download/npdf-screens/. results/api30/screens/ || true
            timeout 60 adb logcat -d > logcat-api30.txt || true
            timeout 60 adb logcat -d -s NPDF-PERF:I NPDF-NET:I NPDF-OCR:I NPDF-SCAN:I > npdf-log-api30.txt || true
            mkdir -p results/api30/app
            cp -r app/build/outputs/androidTest-results/. results/api30/app/ || true
            test -f ok30b

      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'EOF' | tee android/summary.md
          import glob, xml.etree.ElementTree as ET
          print("| Android | Suite | Tests | Failed |")
          print("|---|---|---|---|")
          tests = failed = 0
          for path in glob.glob("android/scankit/build/test-results/test/TEST-*.xml"):
              t = ET.parse(path).getroot()
              tests += int(t.get("tests", 0)); failed += int(t.get("failures", 0)) + int(t.get("errors", 0))
          if tests:
              print(f"| JVM | scanner and export | {tests} | {failed} |")
          for api in ("api34", "api30"):
              for suite in ("engine", "app"):
                  tests = failed = 0
                  for path in glob.glob(f"android/results/{api}/{suite}/**/TEST-*.xml", recursive=True):
                      t = ET.parse(path).getroot()
                      tests += int(t.get("tests", 0)); failed += int(t.get("failures", 0)) + int(t.get("errors", 0))
                  if tests:
                      print(f"| {api[3:]} | {suite} | {tests} | {failed} |")
          EOF
          cat android/scankit/build/test-results/test/*.xml 2>/dev/null | grep -oE 'NPDF-SCAN [^<]*' | grep -E 'overall|refined|time|filter Auto' | tee -a android/summary.md || true
          cat android/npdf-log-api34.txt android/npdf-log-api30.txt 2>/dev/null | grep -E 'NPDF' | sed 's/^.*\(NPDF-[A-Z]*\)/\1/' | tee -a android/summary.md || true

      - name: Android 11 result
        if: ${{ !cancelled() }}
        working-directory: android
        run: |
          if [ -f lost30 ]; then
            echo "Android 11: the first emulator exited mid-run with no failed test; the Android 11 row is from a re-run on a fresh emulator." | tee -a summary.md
            test -f ok30b
          else
            test -f ok30
          fi

      - name: Upload APK and test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: n-pdf-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/results/
            android/scankit/build/test-results/
            android/summary.md
            android/logcat-api34.txt
            android/logcat-api30.txt
            android/npdf-log-*.txt
            permissions.txt
          if-no-files-found: warn

      - name: Publish pre-release with the APK
        if: success() && github.event_name == 'push' && !contains(github.event.head_commit.message, '[no release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          tag="android-v$version-build.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk N-PDF-Android.apk
          sha=$(sha256sum N-PDF-Android.apk | cut -d' ' -f1)
          echo "$sha  N-PDF-Android.apk" > N-PDF-Android.apk.sha256
          size=$(du -m N-PDF-Android.apk | cut -f1)
          {
            echo "Test build of ${{ github.sha }} for Android 8.0 and later. All tests passed on Android 14 and Android 11 emulators (android-summary.md)."
            echo
            echo "N-PDF-Android.apk  ${size} MB  SHA-256 $sha"
            echo
            if [ -f android/lost30 ]; then echo "The first Android 11 emulator exited mid-run with no failed test; the Android 11 tests were re-run in full on a fresh emulator and passed."; echo; fi
            echo "Signed with a key made for this build only: uninstall an earlier N PDF test build before installing this one. Your PDFs are not affected."
          } > notes.txt
          cp android/summary.md android-summary.md
          gh release create "$tag" N-PDF-Android.apk N-PDF-Android.apk.sha256 android-summary.md --target ${{ github.sha }} --prerelease --title "N PDF for Android $tag" --notes-file notes.txt
